<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাইভ এডমিশন এক্সাম পোর্টাল</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 10px; }
        .box { background: white; padding: 20px; border-radius: 12px; max-width: 650px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #1e293b; margin-top: 0; }
        .exam-card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 18px; margin-bottom: 15px; background: #f8fafc; text-align: center; }
        .exam-title { font-size: 20px; font-weight: bold; color: #0f172a; margin-bottom: 5px; }
        .btn { padding: 12px 18px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; display: inline-block; font-size: 15px; }
        .btn-start { background: #2563eb; width: 100%; font-size: 16px; margin-top: 10px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; }
        .timer { font-size: 16px; font-weight: bold; color: #dc2626; }
        .palette { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .p-btn { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #cbd5e1; background: white; font-size: 13px; font-weight: bold; cursor: pointer; }
        .p-btn.answered { background: #22c55e; color: white; border-color: #22c55e; }
        .p-btn.current { border: 2px solid #2563eb; font-weight: 900; }
        .opt { display: block; width: 100%; padding: 12px; margin: 8px 0; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; text-align: left; font-size: 15px; cursor: pointer; box-sizing: border-box; }
        .opt.selected { background: #dbeafe; border-color: #2563eb; font-weight: bold; }
        .nav-btns { display: flex; justify-content: space-between; margin-top: 15px; gap: 8px; }
        .btn-nav { background: #475569; flex: 1; }
        .btn-clear { background: #ef4444; }
        .btn-submit { background: #16a34a; flex: 1; }
        .summary { text-align: left; margin-top: 15px; border-top: 2px solid #e2e8f0; padding-top: 10px; }
        .explanation { background: #f0fdf4; border-left: 4px solid #22c55e; padding: 10px 12px; font-size: 14px; margin-top: 6px; color: #166534; border-radius: 0 6px 6px 0; }
        .correct-ans { color: #16a34a; font-weight: bold; }
        .wrong-ans { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <div id="dash">
        <h1>🚀 লাইভ এক্সাম পোর্টাল</h1>
        <p style="text-align: center; color: #64748b; font-size: 14px; margin-bottom: 20px;">বিশ্ববিদ্যালয় ভর্তি প্রস্তুতি (RU, CU, KU, CoU & GST Special)</p>
        <div id="exam-list"></div>
    </div>

    <div id="quiz" style="display:none;">
        <div class="top-bar">
            <span id="sub-tag" style="font-weight: bold; color: #334155;"></span>
            <div class="timer">⏱️ সময় বাকি: <span id="time">00:00</span></div>
        </div>
        <div class="palette" id="palette"></div>
        <h3 id="q-text" style="margin-bottom: 15px; color: #1e293b; font-size: 17px; line-height: 1.5;"></h3>
        <div id="opts"></div>
        <div class="nav-btns">
            <button class="btn btn-nav" onclick="prevQ()">Previous</button>
            <button class="btn btn-clear" onclick="clearAns()">Clear</button>
            <button class="btn btn-nav" onclick="nextQ()">Next</button>
        </div>
        <button class="btn btn-submit" style="width: 100%; margin-top: 15px;" onclick="confirmSubmit()">Submit Exam</button>
    </div>

    <div id="res" style="display:none;">
        <h2>📊 পরীক্ষার ফলাফল</h2>
        <div id="score-card" style="text-align:center; font-size:18px; margin-bottom:15px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;"></div>
        <div id="review-sec" class="summary"></div>
        <button class="btn btn-start" style="margin-top:15px;" onclick="location.reload()">ড্যাশবোর্ডে ফিরে যান</button>
    </div>
</div>

<script>
// সরাসরি প্রশ্ন কোডের ভেতরেই যুক্ত করে দেওয়া হলো
const liveExams = [
    {
        id: "c_1",
        title: "বৃত্ত (Circle) স্পেশাল এক্সাম",
        subject: "উচ্চতর গণিত ১ম পত্র",
        durationMinutes: 10,
        questions: [
            {
                q: "1. x² + y² - 6x + 8y = 0 বৃত্তের কেন্দ্র এবং ব্যাসার্ধ কত?",
                options: ["(3, -4) ও 5", "(-3, 4) ও 5", "(3, 4) ও 25", "(-3, -4) ও 5"],
                ans: 0,
                explain: "কেন্দ্র (-g, -f) = (3, -4) এবং ব্যাসার্ধ r = √(g² + f² - c) = √(9 + 16 - 0) = 5।"
            },
            {
                q: "2. x² + y² - 8x + 6y + 9 = 0 বৃত্তটি দ্বারা x-অক্ষের ছেদাংশের পরিমাণ কত?",
                options: ["10", "2√7", "2√15", "8"],
                ans: 1,
                explain: "x-অক্ষের খণ্ডিতাংশ = 2√(g² - c) = 2√((-4)² - 9) = 2√(16 - 9) = 2√7।"
            },
            {
                q: "3. x² + y² - 4x + 6y + c = 0 বৃত্তটি y-অক্ষকে স্পর্শ করলে c এর মান কত?",
                options: ["4", "9", "13", "-9"],
                ans: 1,
                explain: "y-অক্ষকে স্পর্শ করার শর্ত f² = c। এখানে 2f = 6 ⇒ f = 3। অতএব c = f² = 3² = 9।"
            },
            {
                q: "4. (1, 2) কেন্দ্রবিশিষ্ট এবং (4, 6) বিন্দুগামী বৃত্তের সমীকরণ কোনটি?",
                options: ["x² + y² - 2x - 4y - 20 = 0", "x² + y² + 2x + 4y - 20 = 0", "x² + y² - 2x - 4y + 5 = 0", "x² + y² - 4x - 2y - 20 = 0"],
                ans: 0,
                explain: "ব্যাসার্ধ r = √((4-1)² + (6-2)²) = 5। সমীকরণ: (x-1)² + (y-2)² = 25 ⇒ x² + y² - 2x - 4y - 20 = 0।"
            },
            {
                q: "5. x² + y² = 25 বৃত্তের (3, 4) বিন্দুতে স্পর্শকের সমীকরণ কোনটি?",
                options: ["3x + 4y = 25", "4x + 3y = 25", "3x - 4y = 25", "4x - 3y = 0"],
                ans: 0,
                explain: "(x₁, y₁) বিন্দুতে স্পর্শকের সমীকরণ xx₁ + yy₁ = a²। সুতরাং 3x + 4y = 25।"
            },
            {
                q: "6. x² + y² = 9 এবং x² + y² - 6x - 8y + 9 = 0 বৃত্তদ্বয় পরস্পরকে কীভাবে স্পর্শ করে?",
                options: ["বহিঃস্থভাবে", "অন্তঃস্থভাবে", "ছেদ করে", "স্পর্শ করে না"],
                ans: 0,
                explain: "১ম বৃত্তের কেন্দ্র C₁(0,0), r₁=3; ২য় বৃত্তের কেন্দ্র C₂(3,4), r₂=2। কেন্দ্রদ্বয়ের দূরত্ব C₁C₂ = 5। যেহেতু 5 = 3 + 2 (r₁ + r₂), তাই বহিঃস্থভাবে স্পর্শ করে।"
            },
            {
                q: "7. মূলবিন্দু দিয়ে যায় এবং x ও y অক্ষের ধনাত্মক দিক থেকে যথাক্রমে 3 ও 5 একক অংশ ছেদ করে এমন বৃত্তের সমীকরণ কোনটি?",
                options: ["x² + y² - 3x - 5y = 0", "x² + y² + 3x + 5y = 0", "x² + y² - 5x - 3y = 0", "x² + y² - 3x + 5y = 0"],
                ans: 0,
                explain: "অক্ষদ্বয়ের খণ্ডিতাংশ a ও b হলে মূলবিন্দুগামী বৃত্তের সমীকরণ: x² + y² - ax - by = 0 ⇒ x² + y² - 3x - 5y = 0।"
            },
            {
                q: "8. x² + y² - 4x - 6y + 3 = 0 বৃত্তের এক-কেন্দ্রিক এবং মূলবিন্দুগামী বৃত্তের সমীকরণ কোনটি?",
                options: ["x² + y² - 4x - 6y = 0", "x² + y² + 4x + 6y = 0", "x² + y² - 2x - 3y = 0", "x² + y² - 4x - 6y + 13 = 0"],
                ans: 0,
                explain: "একই কেন্দ্র (2, 3) এবং মূলবিন্দুগামী (c = 0) হওয়ায় সমীকরণটি হবে x² + y² - 4x - 6y = 0।"
            }
        ]
    }
];

let activeExam = null;
let currentQIdx = 0;
let userAnswers = {};
let totalSeconds = 0;
let mainTimer = null;

function renderExams() {
    const listDiv = document.getElementById("exam-list");
    let html = "";
    liveExams.forEach((ex, idx) => {
        html += `
            <div class="exam-card">
                <div class="exam-title">${ex.title}</div>
                <div style="font-size:14px; color:#64748b; margin: 8px 0 12px 0;">📚 ${ex.subject} | ⏱️ সময়: ${ex.durationMinutes} মিনিট | ❓ মোট প্রশ্ন: ${ex.questions.length}টি</div>
                <button class="btn btn-start" onclick="startLiveExam(${idx})">START EXAM</button>
            </div>
        `;
    });
    listDiv.innerHTML = html;
}

function startLiveExam(index) {
    activeExam = liveExams[index];
    userAnswers = {};
    currentQIdx = 0;
    totalSeconds = activeExam.durationMinutes * 60;

    document.getElementById("dash").style.display = "none";
    document.getElementById("quiz").style.display = "block";
    document.getElementById("sub-tag").innerText = activeExam.subject;

    startTimer();
    renderPalette();
    loadQuestion(0);
}

function startTimer() {
    mainTimer = setInterval(() => {
        totalSeconds--;
        let m = Math.floor(totalSeconds / 60);
        let s = totalSeconds % 60;
        document.getElementById("time").innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;

        if (totalSeconds <= 0) {
            clearInterval(mainTimer);
            alert("সময় শেষ! পরীক্ষা জমা দেওয়া হচ্ছে...");
            submitExam();
        }
    }, 1000);
}

function renderPalette() {
    let pHTML = "";
    activeExam.questions.forEach((_, i) => {
        let isAnswered = userAnswers.hasOwnProperty(i);
        let isCurrent = i === currentQIdx;
        pHTML += `<button class="p-btn ${isAnswered ? 'answered' : ''} ${isCurrent ? 'current' : ''}" onclick="loadQuestion(${i})">${i + 1}</button>`;
    });
    document.getElementById("palette").innerHTML = pHTML;
}

function loadQuestion(idx) {
    currentQIdx = idx;
    renderPalette();
    const qData = activeExam.questions[idx];
    
    document.getElementById("q-text").innerText = qData.q;
    let optsHTML = "";

    qData.options.forEach((optText, oIdx) => {
        let isSelected = userAnswers[idx] === oIdx;
        optsHTML += `
            <button class="opt ${isSelected ? 'selected' : ''}" onclick="selectOption(${oIdx})">
                <b>${String.fromCharCode(65 + oIdx)}.</b> ${optText}
            </button>
        `;
    });

    document.getElementById("opts").innerHTML = optsHTML;
}

function selectOption(optIdx) {
    userAnswers[currentQIdx] = optIdx;
    loadQuestion(currentQIdx);
}

function clearAns() {
    delete userAnswers[currentQIdx];
    loadQuestion(currentQIdx);
}

function nextQ() {
    if (currentQIdx < activeExam.questions.length - 1) loadQuestion(currentQIdx + 1);
}

function prevQ() {
    if (currentQIdx > 0) loadQuestion(currentQIdx - 1);
}

function confirmSubmit() {
    if (confirm("আপনি কি পরীক্ষা জমা দিতে চান?")) {
        clearInterval(mainTimer);
        submitExam();
    }
}

function submitExam() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("res").style.display = "block";

    let correctCount = 0;
    let wrongCount = 0;
    let unansweredCount = 0;

    activeExam.questions.forEach((q, i) => {
        if (userAnswers.hasOwnProperty(i)) {
            if (userAnswers[i] === q.ans) {
                correctCount++;
            } else {
                wrongCount++;
            }
        } else {
            unansweredCount++;
        }
    });

    let score = (correctCount * 1) - (wrongCount * 0.25);
    score = score < 0 ? 0 : score;

    document.getElementById("score-card").innerHTML = `
        <h3 style="margin:0 0 10px 0;">প্রাপ্ত নম্বর: <span style="color:#2563eb; font-size:22px;">${score}</span> / ${activeExam.questions.length}</h3>
        <p style="font-size: 14px; margin:0;">
            <span class="correct-ans">সঠিক: ${correctCount}</span> | 
            <span class="wrong-ans">ভুল (-০.২৫): ${wrongCount}</span> | 
            <span>উত্তর দেননি: ${unansweredCount}</span>
        </p>
    `;

    let reviewHTML = "<h3>📖 উত্তরপত্র ও ব্যাখ্যা:</h3>";
    activeExam.questions.forEach((q, i) => {
        let uAns = userAnswers[i];
        let isCorrect = uAns === q.ans;
        let uAnsText = uAns !== undefined ? q.options[uAns] : "উত্তর দেওয়া হয়নি";

        reviewHTML += `
            <div style="margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
                <p style="font-weight:bold; margin-bottom: 5px;">${q.q}</p>
                <p style="font-size:14px; margin: 3px 0;">আপনার উত্তর: <span class="${isCorrect ? 'correct-ans' : 'wrong-ans'}">${uAnsText}</span></p>
                ${!isCorrect ? `<p style="font-size:14px; margin: 3px 0;">সঠিক উত্তর: <span class="correct-ans">${q.options[q.ans]}</span></p>` : ''}
                <div class="explanation">💡 <b>ব্যাখ্যা:</b> ${q.explain}</div>
            </div>
        `;
    });

    document.getElementById("review-sec").innerHTML = reviewHTML;
}

// অ্যাপ চালু করা
renderExams();
</script>

</body>
</html>
