<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Exam</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .question-card {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .question-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .options-list {
            list-style-type: none;
            padding: 0;
        }
        .options-list li {
            background: #eef2f7;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .options-list li:hover {
            background: #dbe4f0;
        }
        .explanation {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #eefbe7;
            border-left: 4px solid #2ecc71;
            font-size: 14px;
        }
        #loading {
            text-align: center;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>এমসিকিউ পরীক্ষা</h2>
    <div id="loading">প্রশ্ন লোড হচ্ছে...</div>
    <div id="quiz-container"></div>
</div>

<script>
    // আপনার গুগল শিটের রূপান্তরিত CSV লিঙ্ক
    const sheetURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTHOE-AjCb7kURK35UT5BuYP5cooeSNrnoz2ADKOfHCDfu0zkorjrjQr8BusDEALEY-scNjYG7hd26c/pub?output=csv';

    async function loadQuiz() {
        try {
            const response = await fetch(sheetURL);
            const data = await response.text();
            
            const rows = data.split('\n').map(row => row.trim()).filter(row => row.length > 0);
            const quizContainer = document.getElementById('quiz-container');
            document.getElementById('loading').style.display = 'none';

            // হেডার বাদ দিয়ে ১ নম্বর লাইন থেকে ডাটা পড়া শুরু
            for (let i = 1; i < rows.length; i++) {
                const columns = rows[i].split(',');

                if(columns.length >= 6) {
                    const question = columns[0];
                    const optA = columns[1];
                    const optB = columns[2];
                    const optC = columns[3];
                    const optD = columns[4];
                    const ans = columns[5];
                    const exp = columns[6] || 'ব্যাখ্যা নেই';

                    const qCard = document.createElement('div');
                    qCard.className = 'question-card';
                    qCard.innerHTML = `
                        <div class="question-title">${i}. ${question}</div>
                        <ul class="options-list">
                            <li onclick="checkAnswer(this, 0, ${ans})">${optA}</li>
                            <li onclick="checkAnswer(this, 1, ${ans})">${optB}</li>
                            <li onclick="checkAnswer(this, 2, ${ans})">${optC}</li>
                            <li onclick="checkAnswer(this, 3, ${ans})">${optD}</li>
                        </ul>
                        <div class="explanation"><b>ব্যাখ্যা:</b> ${exp}</div>
                    `;
                    quizContainer.appendChild(qCard);
                }
            }
        } catch (error) {
            document.getElementById('loading').innerText = 'ডাটা লোড করতে সমস্যা হয়েছে!';
            console.error('Error fetching CSV:', error);
        }
    }

    function checkAnswer(element, selected, correct) {
        const parent = element.parentElement;
        const explanation = parent.nextElementSibling;
        
        if (selected == correct) {
            element.style.backgroundColor = '#2ecc71';
            element.style.color = '#fff';
        } else {
            element.style.backgroundColor = '#e74c3c';
            element.style.color = '#fff';
        }

        explanation.style.display = 'block';
    }

    loadQuiz();
</script>

</body>
</html>
